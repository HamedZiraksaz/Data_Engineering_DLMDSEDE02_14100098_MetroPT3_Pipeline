services:
  db:
    image: postgres:16
    container_name: metropt_db
    environment:
      POSTGRES_DB: metropt
      POSTGRES_USER: metropt
      POSTGRES_PASSWORD: metropt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metropt -d metropt"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Load one month at a time, for example:
  #   docker compose run --rm ingestion --month 2020-02
  ingestion:
    build: ./ingestion
    container_name: metropt_ingestion
    depends_on:
      db:
        condition: service_healthy
    environment:
      JDBC_URL: jdbc:postgresql://db:5432/metropt
      DB_USER: metropt
      DB_PASSWORD: metropt
      DATA_DIR: /data/raw
    volumes:
      - ./data/raw:/data/raw:ro
    mem_limit: 3g

  # After loading at least one month, run the processing job:
  #   docker compose run --rm processing
  processing:
    build: ./processing
    container_name: metropt_processing
    depends_on:
      db:
        condition: service_healthy
    environment:
      JDBC_URL: jdbc:postgresql://db:5432/metropt
      DB_USER: metropt
      DB_PASSWORD: metropt
    mem_limit: 3g

  delivery:
    build: ./delivery
    container_name: metropt_delivery
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: metropt
      DB_USER: metropt
      DB_PASSWORD: metropt
    ports:
      - "8501:8501"
    mem_limit: 512m

volumes:
  pgdata:
